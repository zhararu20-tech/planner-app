<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1c1a17">
<title>Мои планы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700&family=Rubik:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --n100:#f9f4ed;--n200:#eee7db;--n300:#dcd3c4;--n400:#c0b6a5;--n500:#a19786;--n600:#82796a;--n700:#645c50;--n800:#474238;--n900:#2e2b25;
  --a200:#ffe1d0;--a300:#ffc6a5;--a400:#f6a06b;--a500:#d67f48;--a600:#b2622d;--a700:#8c491a;--a800:#643312;
  --b200:#e1eecc;--b300:#ccdbb2;--b400:#aebf92;--b900:#272e1b;
  --bg:#1c1a17;
  --head:'Rubik',system-ui,sans-serif;
  --body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --safe-top:max(env(safe-area-inset-top),var(--tg-content-safe-area-inset-top,0px));
  --safe-bot:max(env(safe-area-inset-bottom),var(--tg-safe-area-inset-bottom,0px));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--n100);font-family:var(--body);overscroll-behavior:none}
body{overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button{font-family:inherit;border:0;background:none;color:inherit;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--a500);outline-offset:2px}
.nosb{scrollbar-width:none}.nosb::-webkit-scrollbar{display:none}
svg{display:block}
.h{font-family:var(--head);font-weight:600;letter-spacing:-.01em}

#app{position:fixed;inset:0;height:var(--tg-viewport-height,100%);display:flex;flex-direction:column;max-width:560px;margin:0 auto}
#main{flex:1;overflow-y:auto;padding:12px 14px calc(var(--safe-bot) + 120px)}
.tabs{flex:none;padding:calc(var(--safe-top) + 10px) 14px 0}
.tabs-in{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:999px;background:var(--n900)}
.tabs-in .ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:var(--n100);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.tabs-in.notes .ind{transform:translateX(100%)}
.tabs-in button{position:relative;height:38px;border-radius:999px;font:600 14px var(--body);color:var(--n400);transition:color .2s}
.tabs-in button.on{color:var(--n900)}
/* заметки */
.notes-head{padding:10px 6px 4px;display:flex;align-items:flex-end;justify-content:space-between}
.notes-head .h{font-size:24px;color:var(--n100)}
.notes-head .count{padding-bottom:3px}
.nlist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.note{background:var(--n900);border-radius:20px;padding:14px 16px;cursor:pointer;transition:background .15s,transform .1s;animation:rise .25s both}
.note:active{background:var(--n800);transform:scale(.99)}
@media(hover:hover){.note:hover{background:var(--n800)}}
.note .nt{font:600 16px/1.3 var(--body);color:var(--n100);overflow-wrap:anywhere}
.note .nb{margin-top:4px;font:400 14px/1.45 var(--body);color:var(--n400);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;white-space:pre-line}
.note .nm{display:flex;align-items:center;gap:10px;margin-top:8px;font:400 12px var(--body);color:var(--n500)}
.note .clip{display:flex;align-items:center;gap:4px;color:var(--b400)}
.sheet.sh-note #desc{min-height:180px;max-height:340px}

/* календарь */
.cal{background:var(--n900);border-radius:28px;padding:14px 12px 6px}
.cal-top{display:flex;align-items:center;justify-content:space-between;padding:0 6px 10px}
.cal-title{display:flex;align-items:center;gap:6px;color:var(--n100);font-size:20px}
.chev{display:flex}
.chev.anim{transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.cal-nav{display:flex;align-items:center;gap:4px}
.today-btn{height:30px;padding:0 12px;border-radius:999px;background:var(--n800);color:var(--a400);font:600 12px var(--body);margin-right:4px;animation:pop .2s}
.ibtn{width:30px;height:30px;border-radius:999px;color:var(--n400);display:flex;align-items:center;justify-content:center;transition:background .15s}
.ibtn:active{background:var(--n800)}
@media(hover:hover){.ibtn:hover{background:var(--n800)}}
.wd{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font:600 11px var(--body);color:var(--n600);letter-spacing:.04em;padding-bottom:4px}
.wd span:nth-child(n+6){color:var(--a700)}
.gridwrap{overflow:hidden;height:48px;will-change:height;touch-action:pan-y}
.slide{will-change:transform,opacity}
.gridwrap.anim{transition:height .32s cubic-bezier(.2,.8,.2,1)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);touch-action:pan-y;--outop:1}
.grid.anim{transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.grid.anim .day.out{transition:opacity .32s}
.day{height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.day .n{width:36px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;font:600 15px var(--body);color:var(--n100);transition:background .15s,color .15s;font-variant-numeric:tabular-nums}
.day .dot{width:4px;height:4px;border-radius:999px;margin-top:-8px}
.day.has .dot{background:var(--b400)}
.day.today .n{color:var(--a400);box-shadow:inset 0 0 0 1.5px var(--a700)}
.day.sel .n{background:var(--a500);color:var(--n900);box-shadow:none}
.day.sel .dot{background:transparent}
.day.out{opacity:var(--outop)}
.handle{display:flex;width:100%;justify-content:center;padding:10px 0 8px;margin-bottom:-4px;cursor:grab;touch-action:none}
.handle:active{cursor:grabbing}
.handle span{transition:background .15s,width .15s}
.handle:active span{background:var(--n600);width:44px}
.handle span,.grab{width:36px;height:4px;border-radius:999px;background:var(--n700)}

/* заголовок дня */
.dayhead{padding:22px 6px 4px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.rel{font:600 12px var(--body);color:var(--a400);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
.dtitle{font-size:24px;line-height:1.1;color:var(--n100)}
.count{font:600 13px var(--body);color:var(--n500);white-space:nowrap;padding-bottom:3px;font-variant-numeric:tabular-nums}
.bar{margin:10px 6px 0;height:6px;border-radius:999px;background:var(--n900);overflow:hidden}
.bar div{height:100%;border-radius:999px;background:var(--b400);transition:width .3s}

/* фильтр */
.chips{display:flex;gap:8px;overflow-x:auto;padding:18px 2px 6px;margin:0 -14px;padding-left:16px;padding-right:16px}
.chip{flex:none;height:34px;padding:0 14px;border-radius:999px;display:flex;align-items:center;gap:7px;font:600 13px var(--body);background:var(--n900);color:var(--n300);transition:background .15s,color .15s}
.chip.on{background:var(--n100);color:var(--n900)}
.chip i{width:8px;height:8px;border-radius:999px}
.chip small{opacity:.55;font-weight:400;font-size:13px}

/* список */
.list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.row{display:flex;gap:10px;align-items:stretch;transition:opacity .2s;animation:rise .25s both}
.row.done{opacity:.45}
.row .tm{width:46px;flex:none;padding-top:17px;text-align:right;font:600 13px var(--body);color:var(--n400);font-variant-numeric:tabular-nums}
.card{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:var(--n900);border-radius:20px;padding:12px 12px 12px 14px;cursor:pointer;transition:background .15s,transform .1s}
.card:active{background:var(--n800);transform:scale(.99)}
@media(hover:hover){.card:hover{background:var(--n800)}}
.card .stripe{width:4px;align-self:stretch;border-radius:999px;flex:none}
.card .body{flex:1;min-width:0}
.card .t{font:600 15px/1.3 var(--body);color:var(--n100);overflow-wrap:anywhere}
.row.done .t{text-decoration:line-through}
.card .meta{display:flex;align-items:center;gap:8px;margin-top:3px;font:400 12px var(--body);color:var(--n500)}
.card .rep{display:flex;align-items:center;gap:4px;color:var(--b400)}
.cb{width:30px;height:30px;flex:none;border-radius:999px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 2px var(--n700);color:var(--n900);transition:background .15s,box-shadow .15s}
.cb svg{opacity:0;transform:scale(.5);transition:opacity .15s,transform .2s cubic-bezier(.3,1.6,.5,1)}
.row.done .cb svg{opacity:1;transform:none}

.empty{padding:44px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;animation:rise .3s both}
.empty .ic{width:56px;height:56px;border-radius:999px;background:var(--b900);margin-bottom:10px;display:flex;align-items:center;justify-content:center;color:var(--b400)}
.empty .h1{font-size:20px;color:var(--n100)}
.empty p{margin:0;font:400 14px var(--body);color:var(--n500)}
.empty button{margin-top:10px;height:40px;padding:0 18px;border-radius:999px;background:var(--n800);color:var(--a400);font:500 14px var(--head)}

.fab{position:fixed;right:max(20px,calc(50% - 260px));bottom:calc(var(--safe-bot) + 28px);width:60px;height:60px;border-radius:999px;background:var(--a500);color:var(--n900);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.45);transition:background .15s,transform .15s;z-index:5}
.fab:active{background:var(--a600);transform:scale(.94)}
@media(hover:hover){.fab:hover{background:var(--a400)}}

/* bottom sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
.open .backdrop{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--n900);border-radius:32px 32px 0 0;padding:10px 18px calc(var(--safe-bot) + 24px);transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);max-height:88%;overflow-y:auto;z-index:11;box-shadow:0 -10px 40px rgba(0,0,0,.35)}
.open .sheet{transform:none}
.sh-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sh-title{font-size:22px;color:var(--n100)}
.xbtn{width:34px;height:34px;border-radius:999px;background:var(--n800);color:var(--n300);display:flex;align-items:center;justify-content:center}
#title{width:100%;height:52px;border-radius:999px;border:0;background:var(--n800);color:var(--n100);padding:0 20px;font:600 16px var(--body);outline:none;color-scheme:dark;user-select:text;-webkit-user-select:text}
#title::placeholder{color:var(--n600)}
#title:focus{box-shadow:inset 0 0 0 1.5px var(--a700)}
.lbl{font:600 13px var(--body);color:var(--n400)}
.lrow{display:flex;align-items:center;justify-content:space-between;margin-top:18px}
.presets{display:flex;gap:6px}
.preset{height:28px;padding:0 10px;border-radius:999px;font:600 12px var(--body);background:var(--n800);color:var(--n400);transition:background .15s,color .15s}
.preset.on{background:var(--a800);color:var(--a200)}
.wheel{position:relative;margin-top:8px;height:160px;border-radius:28px;background:var(--n800);display:flex;justify-content:center;align-items:stretch;gap:4px;overflow:hidden;transition:opacity .2s}
.wheel.off{opacity:.45}
.wheel .band{position:absolute;left:12px;right:12px;top:60px;height:40px;border-radius:999px;background:var(--n700);pointer-events:none}
.col{position:relative;width:84px;overflow-y:auto;scroll-snap-type:y mandatory;padding:60px 0;-webkit-mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent);mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent);overscroll-behavior:contain}
.col div{height:40px;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;font:500 24px var(--head);font-variant-numeric:tabular-nums;color:var(--n400);cursor:pointer;transition:color .1s}
.col div.on{color:var(--a400)}
.colon{position:relative;display:flex;align-items:center;font:500 24px var(--head);color:var(--n400);padding-bottom:3px}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.fcat{height:36px;padding:0 14px;border-radius:999px;display:flex;align-items:center;gap:7px;font:600 13px var(--body);background:var(--n800);color:var(--n300);transition:background .15s,color .15s}
.fcat.on{background:var(--n100);color:var(--n900)}
.fcat i{width:8px;height:8px;border-radius:999px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px;padding:4px;background:var(--n800);border-radius:999px}
.seg button{height:34px;border-radius:999px;font:600 12px var(--body);color:var(--n400);transition:background .15s,color .15s;white-space:nowrap}
.seg button.on{background:var(--n100);color:var(--n900)}
.custom{display:none;align-items:center;justify-content:space-between;margin-top:10px;padding:8px 8px 8px 18px;background:var(--n800);border-radius:999px;animation:pop .2s}
.custom.on{display:flex}
.custom > span{font:600 14px var(--body);color:var(--n200)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:34px;height:34px;border-radius:999px;background:var(--n700);color:var(--n100);display:flex;align-items:center;justify-content:center}
.stepper button:active{background:var(--n600)}
#nval{min-width:62px;text-align:center;font-size:18px;color:var(--a400)}
.hint{margin-top:12px;padding:12px 16px;border-radius:20px;background:var(--b900);color:var(--b300);font:400 13px/1.45 var(--body)}
.save{margin-top:20px;width:100%;height:52px;border-radius:999px;background:var(--a500);color:var(--n900);font:600 17px var(--head);transition:background .15s,opacity .15s}
.save:disabled{opacity:.45;cursor:default}
.save:not(:disabled):active{background:var(--a600)}
.del{margin-top:8px;width:100%;height:46px;border-radius:999px;color:var(--a400);font:600 14px var(--body);display:none;align-items:center;justify-content:center;gap:8px}
.del.on{display:flex}
.del:active{background:var(--n800)}

/* перетаскивание шторки */
.sh-drag{touch-action:none;margin:-10px -18px 0;padding:10px 18px 0;cursor:grab}
.sh-drag .grabrow{display:flex;justify-content:center;padding:4px 0 14px}
.sh-drag:active .grab{background:var(--n600);width:44px}
.grab{transition:background .15s,width .15s}
.sh-drag .sh-head{margin-bottom:10px}

/* описание и файлы */
#desc{width:100%;display:block;margin-top:10px;min-height:76px;max-height:180px;resize:none;border-radius:24px;border:0;background:var(--n800);color:var(--n100);padding:14px 20px;font:400 15px/1.45 var(--body);outline:none;color-scheme:dark;user-select:text;-webkit-user-select:text}
#desc::placeholder{color:var(--n600)}
#desc:focus{box-shadow:inset 0 0 0 1.5px var(--a700)}
.files{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.files:empty{display:none}
.file{display:flex;align-items:center;gap:12px;padding:8px;border-radius:20px;background:var(--n800);cursor:pointer;animation:pop .2s}
.file .th{width:48px;height:48px;border-radius:14px;background:var(--n700);color:var(--n300);display:flex;align-items:center;justify-content:center;font:600 11px var(--body);overflow:hidden;flex:none;text-transform:uppercase}
.file .th img{width:100%;height:100%;object-fit:cover}
.file .fi{flex:1;min-width:0}
.file .fn{font:600 14px var(--body);color:var(--n100);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file .fs{font:400 12px var(--body);color:var(--n500);margin-top:2px}
.file .rm{width:32px;height:32px;border-radius:999px;color:var(--n400);display:flex;align-items:center;justify-content:center;flex:none}
.file .rm:active{background:var(--n700)}
.attach{margin-top:10px;height:44px;width:100%;border-radius:999px;background:var(--n800);color:var(--a400);font:600 14px var(--body);display:flex;align-items:center;justify-content:center;gap:8px}
.attach:active{background:var(--n700)}
.card .desc{margin-top:4px;font:400 13px/1.4 var(--body);color:var(--n400);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.card .clip{display:flex;align-items:center;gap:4px}
#viewer{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;flex-direction:column;max-width:560px;margin:0 auto}
#viewer.on{display:flex;animation:pop .2s}
.vtop{flex:none;display:flex;align-items:center;gap:10px;padding:calc(var(--safe-top) + 10px) 14px 10px}
.vname{flex:1;min-width:0;font:600 15px var(--body);color:var(--n100);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.vbtn{width:38px;height:38px;border-radius:999px;background:var(--n900);color:var(--n200);display:flex;align-items:center;justify-content:center;flex:none}
.vbtn:active{background:var(--n800)}
.vbody{flex:1;min-height:0;overflow:auto;padding:4px 8px calc(var(--safe-bot) + 16px);-webkit-overflow-scrolling:touch;user-select:text;-webkit-user-select:text}
.vbody.image,.vbody.video{display:flex;align-items:center;justify-content:center}
.vbody img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px;cursor:zoom-in}
.vbody.zoom{display:block}.vbody.zoom img{max-width:none;max-height:none;width:220%;cursor:zoom-out}
.vbody video{max-width:100%;max-height:100%;border-radius:12px;background:#000}
.vbody.pdf canvas{display:block;margin:0 auto 8px;border-radius:6px;background:#fff}
.vbody.text{padding:4px 14px}
.vtext{margin:0;font:400 13px/1.5 ui-monospace,Menlo,Consolas,monospace;color:var(--n200);white-space:pre-wrap;overflow-wrap:anywhere}
.vload{padding:60px 0;text-align:center;font:400 14px var(--body);color:var(--n500)}
.vmsg{display:flex;flex-direction:column;align-items:center;gap:6px;padding:48px 24px;text-align:center;color:var(--n300)}
.vmsg svg{width:40px;height:40px;color:var(--n500);margin-bottom:8px}
.vm1{font:600 16px var(--body);color:var(--n100);overflow-wrap:anywhere}
.vm2{font:400 13px var(--body);color:var(--n500)}
.vmsg p{margin:10px 0 0;font:400 14px/1.45 var(--body);color:var(--n400)}
.vmsg button{margin-top:14px;height:44px;padding:0 22px;border-radius:999px;background:var(--a500);color:var(--n900);font:600 14px var(--body)}
.vmsg audio{margin-top:16px;width:100%;max-width:340px}
.clip{cursor:pointer}

@keyframes rise{from{opacity:0;transform:translateY(6px)}}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="tabs"><div class="tabs-in" id="tabs">
    <span class="ind"></span>
    <button data-a="tab" data-t="cal" class="on">Календарь</button>
    <button data-a="tab" data-t="notes">Заметки</button>
  </div></div>
  <div id="main" class="nosb"></div>
  <button class="fab" data-a="new" aria-label="Добавить план">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
  </button>
</div>

<div id="sheetwrap">
  <div class="backdrop" data-a="close"></div>
  <div class="sheet nosb" role="dialog" aria-modal="true">
    <div class="sh-drag" id="shDrag">
      <div class="grabrow"><span class="grab"></span></div>
      <div class="sh-head">
        <span class="sh-title h" id="shTitle"></span>
        <button class="xbtn" data-a="close" aria-label="Закрыть"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      </div>
    </div>
    <input id="title" placeholder="Тема задачи" maxlength="120" autocomplete="off" enterkeyhint="next">
    <textarea id="desc" placeholder="Описание (необязательно)" maxlength="2000" rows="3"></textarea>
    <div class="files" id="files"></div>
    <button class="attach" data-a="attach"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>Прикрепить файл</button>
    <input type="file" id="fileIn" multiple hidden>
    <div id="taskFields">
    <div class="lrow"><span class="lbl">Время</span><div class="presets" id="presets"></div></div>
    <div class="wheel" id="wheel">
      <div class="band"></div>

    <div class="lbl" style="margin-top:18px">Категория</div>
    <div class="cats" id="fcats"></div>
    <div class="lbl" style="margin-top:18px">Повторять</div>
    <div class="seg" id="seg"></div>
    <div class="custom" id="custom">
      <span>Каждые</span>
      <div class="stepper">
        <button data-a="dec" aria-label="Меньше"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
        <span id="nval" class="h"></span>
        <button data-a="inc" aria-label="Больше"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
      </div>
    </div>

    </div>
    <button class="save" id="save" data-a="save"></button>
    <button class="del" id="del" data-a="del"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg><span id="delLbl"></span></button>
  </div>
</div>

<div id="viewer">
  <div class="vtop">
    <button class="vbtn" data-a="vclose" aria-label="Закрыть"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <div class="vname" id="vname"></div>
    <button class="vbtn" data-a="vshare" aria-label="Поделиться"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="m16 6-4-4-4 4"/><path d="M12 2v13"/></svg></button>
  </div>
  <div class="vbody" id="vbody"></div>
</div>

<script>
// ---------- утилиты дат (всё в локальном времени) ----------
const pad=n=>String(n).padStart(2,'0');
const toKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromKey=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=fromKey(k);d.setDate(d.getDate()+n);return toKey(d)};
const diff=(a,b)=>Math.round((fromKey(b)-fromKey(a))/864e5);
const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_G=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD_FULL=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const CATS=[
  {id:'work',name:'Работа',color:'var(--a400)'},
  {id:'personal',name:'Личное',color:'var(--b400)'},
  {id:'health',name:'Здоровье',color:'var(--b200)'},
  {id:'study',name:'Учёба',color:'var(--a200)'}];
const plural=(n,f)=>{const a=n%10,b=n%100;return a===1&&b!==11?f[0]:a>=2&&a<=4&&(b<10||b>=20)?f[1]:f[2]};
const days=n=>`${n} ${plural(n,['день','дня','дней'])}`;
const repeatLabel=n=>!n?'':n===1?'каждый день':n===7?'каждую неделю':`каждые ${days(n)}`;
const occurs=(t,k)=>{if(!t.every)return t.date===k;const d=diff(t.date,k);return d>=0&&d%t.every===0};
const short=k=>{const d=fromKey(k);return `${d.getDate()} ${MONTHS_G[d.getMonth()]}`};
const modeOf=e=>!e?'none':e===1?'daily':e===7?'weekly':'custom';
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const ICON={
  chev:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
  left:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',
  right:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>',
  repeat:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>',
  clip:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>',
  doc:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>',
  x:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>',
  check:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.25" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  clock:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
};

// ---------- Telegram ----------
const TG=window.Telegram&&Telegram.WebApp&&Telegram.WebApp.initData!==undefined?Telegram.WebApp:null;
const inTG=!!(TG&&TG.platform&&TG.platform!=='unknown');
const ver=v=>inTG&&TG.isVersionAtLeast&&TG.isVersionAtLeast(v);
const haptic={
  tap(){try{inTG&&TG.HapticFeedback.selectionChanged()}catch(e){}},
  hit(s='light'){try{inTG&&TG.HapticFeedback.impactOccurred(s)}catch(e){}},
  ok(){try{inTG&&TG.HapticFeedback.notificationOccurred('success')}catch(e){}},
};
if(inTG){
  TG.ready();TG.expand();
  try{TG.setHeaderColor('#1c1a17');TG.setBackgroundColor('#1c1a17')}catch(e){}
  if(ver('7.10'))try{TG.setBottomBarColor('#1c1a17')}catch(e){}
  if(ver('7.7'))try{TG.disableVerticalSwipes()}catch(e){}
  TG.BackButton.onClick(()=>backAction());
}

// ---------- данные: Telegram CloudStorage (в вашем аккаунте, без сервера) + localStorage для мгновенного старта ----------
// CloudStorage: значение до 4096 символов, поэтому состояние режется на куски s0..sN, число кусков — в «sn».
const LS='tg-planner-v2',CHUNK=4000;
const cloud=inTG&&ver('6.9')?TG.CloudStorage:null;
function pruneDone(done){const lim=addDays(toKey(new Date()),-180),o={};for(const k in done)if(k.split('|')[1]>=lim)o[k]=true;return o}
function persist(){
  S.done=pruneDone(S.done);
  const data=JSON.stringify({tasks:S.tasks,done:S.done,notes:S.notes,ts:Date.now()});
  try{localStorage.setItem(LS,data)}catch(e){}
  if(!cloud)return;
  clearTimeout(persist.t);
  persist.t=setTimeout(()=>{
    const parts=[];for(let i=0;i<data.length;i+=CHUNK)parts.push(data.slice(i,i+CHUNK));
    let left=parts.length;
    parts.forEach((p,i)=>cloud.setItem('s'+i,p,err=>{if(err)return console.error(err);if(--left===0)cloud.setItem('sn',String(parts.length))}));
  },300);
}
function load(){
  if(!cloud)return;
  cloud.getItem('sn',(e,n)=>{
    n=+n;if(e||!n)return;
    const keys=Array.from({length:n},(_,i)=>'s'+i);
    cloud.getItems(keys,(e2,vals)=>{
      if(e2||!vals)return;
      try{
        const s=JSON.parse(keys.map(k=>vals[k]||'').join(''));
        let local=0;try{local=JSON.parse(localStorage.getItem(LS)).ts||0}catch(e){}
        if(s&&Array.isArray(s.tasks)&&(s.ts||0)>=local){
          S.tasks=s.tasks;S.done=s.done||{};S.notes=s.notes||[];
          try{localStorage.setItem(LS,JSON.stringify(s))}catch(e){}
          if(!S.sheet)render();
        }
      }catch(e){}
    });
  });
}

// ---------- состояние ----------
const today=toKey(new Date());
let saved={};try{saved=JSON.parse(localStorage.getItem(LS))||{}}catch(e){}  // кэш до ответа сервера
let tab='cal';try{tab=localStorage.getItem('tg-planner-tab')==='notes'?'notes':'cal'}catch(e){}
const S={today,selected:today,cursor:today,expanded:false,cat:'all',sheet:false,editId:null,tab,kind:'task',
  form:{title:'',desc:'',files:[],time:'',cat:'work',mode:'none',n:3},tasks:saved.tasks||[],done:saved.done||{},notes:saved.notes||[]};
const every=f=>f.mode==='none'?0:f.mode==='daily'?1:f.mode==='weekly'?7:f.n;

// ---------- главный экран ----------
const main=$('main');
function render(){
  $('tabs').classList.toggle('notes',S.tab==='notes');
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));
  if(S.tab==='notes')return renderNotes();
  const ex=S.expanded,cur=fromKey(S.cursor),cm=cur.getMonth(),cy=cur.getFullYear(),sel=S.selected;
  // всегда рисуем месяц целиком; в свёрнутом виде видна только строка недели курсора (см. applyCal)
  const first=new Date(cy,cm,1),off=(first.getDay()+6)%7,dim=new Date(cy,cm+1,0).getDate();
  const start=addDays(toKey(first),-off);
  CAL.rows=Math.ceil((off+dim)/7);CAL.row=Math.floor((off+cur.getDate()-1)/7);
  let daysHtml='';
  for(let i=0;i<CAL.rows*7;i++){
    const k=addDays(start,i),d=fromKey(k);
    const cls=['day',k===sel&&'sel',k===S.today&&'today',d.getMonth()!==cm&&'out',S.tasks.some(t=>occurs(t,k))&&'has'].filter(Boolean).join(' ');
    daysHtml+=`<button class="${cls}" data-a="day" data-k="${k}"><span class="n">${d.getDate()}</span><span class="dot"></span></button>`;
  }
  const showToday=sel!==S.today||S.cursor!==sel;

  const dayAll=S.tasks.filter(t=>occurs(t,sel));
  const inCat=dayAll.filter(t=>S.cat==='all'||t.cat===S.cat).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const isDone=t=>!!S.done[`${t.id}|${sel}`];
  const doneCount=inCat.filter(isDone).length;
  const sd=fromKey(sel),rd=diff(S.today,sel);
  const rel=rd===0?'Сегодня':rd===1?'Завтра':rd===-1?'Вчера':'';

  const chip=(id,name,color,n)=>`<button class="chip${S.cat===id?' on':''}" data-a="cat" data-id="${id}">${color?`<i style="background:${color}"></i>`:''}${name}<small>${n}</small></button>`;
  const chips=chip('all','Все','',dayAll.length)+CATS.map(c=>chip(c.id,c.name,c.color,dayAll.filter(t=>t.cat===c.id).length)).join('');

  const items=inCat.map(t=>{const c=CATS.find(x=>x.id===t.cat)||CATS[0],dn=isDone(t);return `
    <div class="row${dn?' done':''}">
      <div class="tm">${t.time||'—'}</div>
      <div class="card" data-a="open" data-id="${t.id}">
        <span class="stripe" style="background:${c.color}"></span>
        <div class="body"><div class="t">${esc(t.title)}</div>
          <div class="meta"><span>${c.name}</span>${t.every?`<span class="rep">${ICON.repeat}${repeatLabel(t.every)}</span>`:''}${t.files&&t.files.length?`<span class="clip" data-a="clip" data-k="task" data-id="${t.id}">${ICON.clip}${t.files.length}</span>`:''}</div>
          ${t.desc?`<div class="desc">${esc(t.desc)}</div>`:''}</div>
        <button class="cb" data-a="toggle" data-id="${t.id}" aria-label="Выполнено" style="${dn?`background:${c.color};box-shadow:inset 0 0 0 2px ${c.color}`:''}">${ICON.check}</button>
      </div>
    </div>`}).join('');

  const chipsScroll=main.querySelector('.chips')?.scrollLeft||0;
  main.innerHTML=`
    <div class="cal">
      <div class="cal-top">
        <button class="cal-title h" data-a="toggleCal">${MONTHS[cm]} ${cy}<span class="chev" id="chev">${ICON.chev}</span></button>
        <div class="cal-nav">
          ${showToday?'<button class="today-btn" data-a="today">Сегодня</button>':''}
          <button class="ibtn" data-a="prev" aria-label="Назад">${ICON.left}</button>
          <button class="ibtn" data-a="next" aria-label="Вперёд">${ICON.right}</button>
        </div>
      </div>
      <div class="wd"><span>ПН</span><span>ВТ</span><span>СР</span><span>ЧТ</span><span>ПТ</span><span>СБ</span><span>ВС</span></div>
      <div class="gridwrap" id="gw"><div class="slide" id="slide"><div class="grid" id="grid">${daysHtml}</div></div></div>
      <div class="handle" id="handle" role="button" tabindex="0" aria-label="Развернуть календарь"><span></span></div>
    </div>
    <div class="dayhead">
      <div>${rel?`<div class="rel">${rel}</div>`:''}<div class="dtitle h">${WD_FULL[sd.getDay()]}, ${sd.getDate()} ${MONTHS_G[sd.getMonth()]}</div></div>
      <div class="count">${doneCount} из ${inCat.length}</div>
    </div>
    <div class="bar"><div style="width:${inCat.length?Math.round(doneCount/inCat.length*100):0}%"></div></div>
    <div class="chips nosb">${chips}</div>
    ${inCat.length?`<div class="list">${items}</div>`:`
    <div class="empty">
      <div class="ic">${ICON.clock}</div>
      <div class="h1 h">Пока свободно</div>
      <p>${S.cat==='all'?'На этот день планов нет.':'В этой категории на этот день планов нет.'}</p>
      <button data-a="new">Добавить план</button>
    </div>`}`;
  const ch=main.querySelector('.chips');if(ch)ch.scrollLeft=chipsScroll;
  // календарь: стартуем с того, что было на экране, и плавно едем к нужному состоянию
  const target=ex?1:0;
  applyCal(CAL.p,false);
  if(CAL.p!==target){$('gw').offsetHeight;applyCal(target,true)}
  bindHandle();bindSwipe();
  if(slideIn){   // после листания новая сетка выезжает с той стороны, куда свайпнули
    const s=$('slide');s.style.transition='none';s.style.transform=`translateX(${slideIn*60}%)`;s.style.opacity='0';
    s.offsetWidth;s.style.transition='transform .3s cubic-bezier(.2,.8,.2,1),opacity .3s';s.style.transform='';s.style.opacity='';
    slideIn=0;
  }
}
let slideIn=0;

// ---------- заметки ----------
function renderNotes(){
  const list=[...S.notes].sort((a,b)=>(b.updated||b.id)-(a.updated||a.id));
  const fmt=ts=>{const d=new Date(ts);return `${d.getDate()} ${MONTHS_G[d.getMonth()]}`};
  const card=n=>{
    let title=n.title,body=n.desc||'';
    if(!title){const i=body.indexOf('\n');title=i<0?body:body.slice(0,i);body=i<0?'':body.slice(i+1).trim()}
    return `<div class="note" data-a="opennote" data-id="${n.id}">
      <div class="nt">${esc(title||'Файлы')}</div>
      ${body?`<div class="nb">${esc(body)}</div>`:''}
      <div class="nm"><span>${fmt(n.updated||n.id)}</span>${n.files&&n.files.length?`<span class="clip" data-a="clip" data-k="note" data-id="${n.id}">${ICON.clip}${n.files.length}</span>`:''}</div>
    </div>`};
  main.innerHTML=`
    <div class="notes-head"><div class="h">Заметки</div><div class="count">${list.length?`${list.length} ${plural(list.length,['заметка','заметки','заметок'])}`:''}</div></div>
    ${list.length?`<div class="nlist">${list.map(card).join('')}</div>`:`
    <div class="empty">
      <div class="ic">${ICON.doc}</div>
      <div class="h1 h">Заметок пока нет</div>
      <p>Записывайте мысли и идеи и прикрепляйте нужные файлы.</p>
      <button data-a="new">Новая заметка</button>
    </div>`}`;
}
function setTab(t){
  if(S.tab===t)return;
  S.tab=t;haptic.tap();try{localStorage.setItem('tg-planner-tab',t)}catch(e){}
  main.scrollTop=0;render();
}

// ---------- раскрытие календаря: p = 0 (неделя) … 1 (месяц) ----------
const ROW=48,CAL={p:0,rows:5,row:0};
function applyCal(p,anim){
  CAL.p=p;
  const gw=$('gw'),grid=$('grid'),chev=$('chev');if(!gw)return;
  gw.classList.toggle('anim',anim);grid.classList.toggle('anim',anim);chev.classList.toggle('anim',anim);
  gw.style.height=ROW+p*(CAL.rows-1)*ROW+'px';
  grid.style.transform=`translateY(${-(1-p)*CAL.row*ROW}px)`;
  grid.style.setProperty('--outop',1-.7*p);
  chev.style.transform=`rotate(${p*180}deg)`;
}
function setExpanded(ex){
  haptic.tap();
  if(S.expanded===ex){applyCal(ex?1:0,true);return}
  S.expanded=ex;if(!ex)S.cursor=S.selected;
  render();
}
function bindHandle(){
  const h=$('handle');let y0,p0,last,drag=null;
  h.addEventListener('pointerdown',e=>{
    h.setPointerCapture(e.pointerId);
    y0=e.clientY;p0=CAL.p;last=[{y:e.clientY,t:e.timeStamp}];drag=false;
  });
  h.addEventListener('pointermove',e=>{
    if(drag===null)return;
    const dy=e.clientY-y0;if(!drag&&Math.abs(dy)<4)return;
    drag=true;
    let p=p0+dy/((CAL.rows-1)*ROW);
    p=p<0?p*.25:p>1?1+(p-1)*.25:p;          // лёгкое «резиновое» сопротивление за краями
    applyCal(Math.max(-.08,Math.min(1.08,p)),false);
    last.push({y:e.clientY,t:e.timeStamp});if(last.length>5)last.shift();
  });
  const end=e=>{
    if(drag===null)return;
    const wasDrag=drag;drag=null;
    if(!wasDrag)return setExpanded(!S.expanded);   // просто тап по плашке
    const a=last[0],b=last[last.length-1],v=(b.y-a.y)/Math.max(1,b.t-a.t);  // px/ms
    const ex=v>.3?true:v<-.3?false:CAL.p>.5;
    setExpanded(ex);
  };
  h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end);
  h.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();setExpanded(!S.expanded)}});
}
// прогресс-бар анимируется: обновляем ширину после перерисовки
const _render=render;
render=function(){const prev=main.querySelector('.bar div')?.style.width;_render();const b=main.querySelector('.bar div');if(b&&prev!==undefined&&prev!==b.style.width){const w=b.style.width;b.style.width=prev;b.offsetWidth;b.style.width=w}};

function step(dir){
  if(S.expanded){const c=fromKey(S.cursor);S.cursor=toKey(new Date(c.getFullYear(),c.getMonth()+dir,1))}
  else S.cursor=addDays(S.cursor,dir*7);
  slideIn=dir;haptic.tap();render();
}

// свайп по календарю: сетка едет за пальцем, при отпускании листает месяц (в свёрнутом виде — неделю)
let swiped=false;
function bindSwipe(){
  const gw=$('gw'),slide=$('slide');let x0=null,y0,dx=0,mode=null,last=[];
  gw.addEventListener('pointerdown',e=>{x0=e.clientX;y0=e.clientY;dx=0;mode=null;last=[{x:e.clientX,t:e.timeStamp}]});
  gw.addEventListener('pointermove',e=>{
    if(x0===null)return;
    const mx=e.clientX-x0,my=e.clientY-y0;
    if(mode===null){
      if(Math.abs(mx)<8&&Math.abs(my)<8)return;
      mode=Math.abs(mx)>Math.abs(my)?'x':'y';
      if(mode==='x'){gw.setPointerCapture(e.pointerId);slide.style.transition='none'}
    }
    if(mode!=='x')return;
    dx=mx;slide.style.transform=`translateX(${dx}px)`;slide.style.opacity=String(1-Math.min(.6,Math.abs(dx)/gw.offsetWidth));
    last.push({x:e.clientX,t:e.timeStamp});if(last.length>5)last.shift();
  });
  const end=()=>{
    if(x0===null)return;
    const was=mode==='x';x0=null;mode=null;
    if(!was)return;
    swiped=true;setTimeout(()=>swiped=false,80);
    const w=gw.offsetWidth,a=last[0],b=last[last.length-1],v=(b.x-a.x)/Math.max(1,b.t-a.t);
    const dir=(dx<-w*.25||v<-.4)?1:(dx>w*.25||v>.4)?-1:0;
    slide.style.transition='transform .22s cubic-bezier(.3,.7,.4,1),opacity .22s';
    if(!dir){slide.style.transform='';slide.style.opacity='';return}
    slide.style.transform=`translateX(${-dir*w}px)`;slide.style.opacity='0';
    setTimeout(()=>step(dir),200);
  };
  gw.addEventListener('pointerup',end);gw.addEventListener('pointercancel',end);
}

// ---------- шит ----------
const wrap=$('sheetwrap'),hcol=$('hcol'),mcol=$('mcol'),titleIn=$('title'),descIn=$('desc');
const sheetEl=document.querySelector('.sheet'),backdropEl=document.querySelector('.backdrop');
hcol.innerHTML=Array.from({length:24*5},(_,i)=>`<div data-i="${i}">${pad(i%24)}</div>`).join('');
mcol.innerHTML=Array.from({length:60*5},(_,i)=>`<div data-i="${i}">${pad(i%60)}</div>`).join('');
let userWheel=false;

const canSave=()=>S.kind==='note'?!!(S.form.title.trim()||S.form.desc.trim()||S.form.files.length):!!S.form.title.trim();
function renderSheet(){

  $('delLbl').textContent=edited&&edited.every?'Удалить всю серию':'Удалить';

function highlightWheels(){
  const on=!!S.form.time||userWheel;
  [[hcol,24],[mcol,60]].forEach(([el])=>{
    const i=Math.round(el.scrollTop/40);
    el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
    if(on)el.children[i]?.classList.add('on');
  });
}
function syncWheels(time,smooth){
  userWheel=false;
  const [h,m]=(time||'09:00').split(':').map(Number);
  requestAnimationFrame(()=>{
    [[hcol,h,24],[mcol,m,60]].forEach(([el,v,n])=>{
      const cur=Math.round(el.scrollTop/40),base=Math.floor(cur/n)*n;
      let idx=smooth?base+v:v+n*2;
      if(smooth){if(idx-cur>n/2)idx-=n;else if(cur-idx>n/2)idx+=n}
      el.scrollTo({top:idx*40,behavior:smooth?'smooth':'auto'});
    });
    highlightWheels();
  });
}
function onWheelScroll(){
  highlightWheels();
  clearTimeout(onWheelScroll.t);
  onWheelScroll.t=setTimeout(()=>{
    const hi=Math.round(hcol.scrollTop/40),mi=Math.round(mcol.scrollTop/40);
    const h=((hi%24)+24)%24,m=((mi%60)+60)%60;
    if(hi<24||hi>=24*4)hcol.scrollTop=(h+48)*40;   // бесконечный барабан: возвращаемся в среднюю копию
    if(mi<60||mi>=60*4)mcol.scrollTop=(m+120)*40;
    if(!userWheel&&!S.form.time)return;              // программная прокрутка при «Весь день» время не задаёт
    const t=`${pad(h)}:${pad(m)}`;
    if(t!==S.form.time){S.form.time=t;haptic.tap();renderSheet()}
  },120);
}
[hcol,mcol].forEach(el=>{
  el.addEventListener('scroll',onWheelScroll,{passive:true});
  ['pointerdown','touchstart','wheel'].forEach(ev=>el.addEventListener(ev,()=>{userWheel=true},{passive:true}));
  el.addEventListener('click',e=>{const d=e.target.closest('[data-i]');if(d){userWheel=true;el.scrollTo({top:+d.dataset.i*40,behavior:'smooth'})}});
});

function saveTask(){
  const f=S.form;if(!canSave())return;
  const note=S.kind==='note',list=note?S.notes:S.tasks;
  const old=(S.editId&&list.find(t=>t.id===S.editId)?.files)||[];
  const base={title:f.title.trim(),desc:f.desc.trim(),files:f.files.map(({id,name,type,size})=>({id,name,type,size}))};
  if(note){
    const data={...base,updated:Date.now()};
    S.notes=S.editId?S.notes.map(n=>n.id===S.editId?{...n,...data}:n):[{id:Date.now(),...data},...S.notes];
  }else{
    const data={...base,time:f.time,cat:f.cat,every:every(f)};
    S.tasks=S.editId?S.tasks.map(t=>t.id===S.editId?{...t,...data}:t):[...S.tasks,{id:Date.now(),date:S.selected,...data}];
  }
  // файлы лежат в IndexedDB на этом устройстве: пишем новые, удаляем убранные
  Promise.all([
    ...f.files.filter(x=>x.blob).map(x=>idb.put(x.id,x.blob)),
    ...old.filter(o=>!f.files.some(x=>x.id===o.id)).map(o=>idb.del(o.id)),
  ]).catch(()=>{const m='Не удалось сохранить вложения на устройстве';inTG&&ver('6.2')?TG.showAlert(m):alert(m)});
  haptic.ok();closeSheet();persist();render();
}
function removeTask(){
  if(S.kind==='note'){
    const n=S.notes.find(x=>x.id===S.editId);if(!n)return;
    const go=()=>{S.notes=S.notes.filter(x=>x.id!==n.id);(n.files||[]).forEach(x=>idb.del(x.id).catch(()=>{}));haptic.hit('medium');closeSheet();persist();render()};
    if(inTG&&ver('6.2'))TG.showConfirm('Удалить заметку?',ok=>ok&&go());else go();
    return;
  }
  const t=S.tasks.find(x=>x.id===S.editId);if(!t)return;
  const go=()=>{S.tasks=S.tasks.filter(x=>x.id!==t.id);for(const k in S.done)if(k.startsWith(t.id+'|'))delete S.done[k];(t.files||[]).forEach(x=>idb.del(x.id).catch(()=>{}));haptic.hit('medium');closeSheet();persist();render()};
  if(t.every&&inTG&&ver('6.2'))TG.showConfirm(`Удалить всю серию «${t.title}»?`,ok=>ok&&go());
  else go();
}

titleIn.addEventListener('input',()=>{S.form.title=titleIn.value;$('save').disabled=!canSave()});
titleIn.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();descIn.focus()}});

// ---------- вложения: файлы хранятся в IndexedDB на этом телефоне (в Telegram Cloud им не поместиться) ----------
const idb=(()=>{
  let p;
  const open=()=>p||(p=new Promise((res,rej)=>{try{const r=indexedDB.open('tg-planner-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}));
  const tx=(mode,fn)=>open().then(db=>new Promise((res,rej)=>{const t=db.transaction('f',mode),r=fn(t.objectStore('f'));t.oncomplete=()=>res(r&&r.result);t.onerror=t.onabort=()=>rej(t.error)}));
  return{put:(k,v)=>tx('readwrite',s=>s.put(v,k)),get:k=>tx('readonly',s=>s.get(k)),del:k=>tx('readwrite',s=>s.delete(k))};
})();
const MAX_FILE=25*1024*1024,MAX_FILES=10;
const urls=new Map();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmtSize=n=>n<1024?n+' Б':n<1048576?Math.round(n/1024)+' КБ':(n/1048576).toFixed(1).replace('.',',')+' МБ';
const alertMsg=m=>inTG&&ver('6.2')?TG.showAlert(m):alert(m);
async function getBlob(f){
  if(f.blob)return f.blob;
  try{return await idb.get(f.id)||null}catch(e){return null}
}
async function getUrl(f){
  if(urls.has(f.id))return urls.get(f.id);
  const b=await getBlob(f);if(!b)return null;
  const u=URL.createObjectURL(b);urls.set(f.id,u);return u;
}
function renderFiles(){
  const box=$('files');$('save').disabled=!canSave();
  box.innerHTML=S.form.files.map(f=>{
    const img=(f.type||'').startsWith('image/');

    return `<div class="file" data-a="openfile" data-id="${f.id}">
      <div class="th">${img?`<img data-th="${f.id}" alt="">`:ICON.doc}</div>
      <div class="fi"><div class="fn">${esc(f.name)}</div><div class="fs">${img?'':ext?ext.toUpperCase()+' · ':''}${fmtSize(f.size)}</div></div>
      <button class="rm" data-a="rmfile" data-id="${f.id}" aria-label="Убрать файл">${ICON.x}</button>
    </div>`}).join('');
  box.querySelectorAll('img[data-th]').forEach(im=>{
    const f=S.form.files.find(x=>x.id===im.dataset.th);
    getUrl(f).then(u=>{if(u)im.src=u;else im.replaceWith(Object.assign(document.createElement('span'),{innerHTML:ICON.doc}))});
  });
}
function addFiles(list){
  for(const file of list){
    if(S.form.files.length>=MAX_FILES){alertMsg(`Не больше ${MAX_FILES} файлов к одной задаче`);break}
    if(file.size>MAX_FILE){alertMsg(`«${file.name}» больше 25 МБ — не прикрепил`);continue}
    S.form.files.push({id:uid(),name:file.name||'файл',type:file.type||'',size:file.size,blob:file});
  }

$('fileIn').addEventListener('change',e=>{addFiles([...e.target.files]);e.target.value=''});

// ---------- просмотр файлов внутри планера ----------
// Telegram не даёт скачивать/открывать blob-файлы системой, поэтому показываем сами: картинки, PDF, видео, аудио, текст.
const fileKind=f=>{
  const t=(f.type||'').toLowerCase(),n=f.name.toLowerCase();
  if(t.startsWith('image/')||/\.(png|jpe?g|gif|webp|bmp|svg|avif|heic|heif)$/.test(n))return 'image';
  if(t.startsWith('video/')||/\.(mp4|mov|webm|m4v|mkv)$/.test(n))return 'video';
  if(t.startsWith('audio/')||/\.(mp3|m4a|wav|ogg|oga|aac|flac|opus)$/.test(n))return 'audio';
  if(t==='application/pdf'||n.endsWith('.pdf'))return 'pdf';
  if(t.startsWith('text/')||/json|xml|javascript|yaml/.test(t)||/\.(txt|md|csv|tsv|json|log|xml|ya?ml|ini|js|ts|py|html?|css|sql|sh|bat|java|c|cpp|cs|go|rs|php|rtf)$/.test(n))return 'text';
  return 'other';
};
let viewing=null,vtoken=0;
const viewerOpen=()=>$('viewer').classList.contains('on');
function closeViewer(){
  if(!viewerOpen())return;
  vtoken++;viewing=null;
  $('viewer').classList.remove('on');$('vbody').innerHTML='';
  if(inTG&&!S.sheet)TG.BackButton.hide();
}
const backAction=()=>viewerOpen()?closeViewer():closeSheet();
async function openFile(f){
  if(!f)return;
  const blob=await getBlob(f);
  if(!blob)return alertMsg('Этого файла нет на этом устройстве: вложения хранятся только на том телефоне, где их добавили.');
  const my=++vtoken,body=$('vbody'),kind=fileKind(f);
  viewing={f,blob};
  $('vname').textContent=f.name;
  body.className='vbody '+kind;body.innerHTML='<div class="vload">Открываю…</div>';
  $('viewer').classList.add('on');body.scrollTop=0;
  if(inTG)TG.BackButton.show();
  haptic.tap();
  const alive=()=>my===vtoken;
  const other=msg=>{if(!alive())return;body.className='vbody other';body.innerHTML=`<div class="vmsg">${ICON.doc}<div class="vm1">${esc(f.name)}</div><div class="vm2">${fmtSize(f.size)}</div><p>${msg||'Этот формат нельзя показать внутри планера.'}</p><button data-a="vshare">Открыть в другом приложении</button></div>`};
  try{
    if(kind==='image'){
      const u=await getUrl(f);if(!alive())return;
      body.innerHTML=`<img alt="" src="${u}">`;
      const im=body.querySelector('img');im.onerror=()=>other('Не получилось показать картинку (формат не поддерживается на этом устройстве).');
      im.onclick=()=>body.classList.toggle('zoom');
    }else if(kind==='video'||kind==='audio'){
      const u=await getUrl(f);if(!alive())return;
      body.innerHTML=kind==='video'?`<video controls playsinline autoplay src="${u}"></video>`:`<div class="vmsg">${ICON.doc}<div class="vm1">${esc(f.name)}</div><audio controls autoplay src="${u}"></audio></div>`;
      body.querySelector(kind).onerror=()=>other('Не получилось воспроизвести: формат не поддерживается на этом устройстве.');
    }else if(kind==='pdf'){
      await renderPdf(blob,body,alive);
    }else if(kind==='text'){
      const txt=await blob.slice(0,400000).text();if(!alive())return;
      body.innerHTML=`<pre class="vtext">${esc(txt)}${blob.size>400000?'\n\n… файл обрезан, показаны первые 400 КБ':''}</pre>`;
    }else other();
  }catch(e){other('Не получилось открыть файл.')}
}
function loadPdfJs(){
  if(window.pdfjsLib)return Promise.resolve();
  return loadPdfJs.p||(loadPdfJs.p=new Promise((res,rej)=>{
    const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res()};
    s.onerror=()=>{loadPdfJs.p=null;rej(new Error('pdf.js'))};document.head.appendChild(s);
  }));
}
async function renderPdf(blob,body,alive){
  await loadPdfJs();
  const pdf=await pdfjsLib.getDocument({data:await blob.arrayBuffer()}).promise;
  if(!alive())return;
  body.innerHTML='';
  const w=Math.max(200,body.clientWidth-16),dpr=Math.min(2,window.devicePixelRatio||1);
  for(let i=1;i<=pdf.numPages&&alive();i++){
    const page=await pdf.getPage(i),base=page.getViewport({scale:1}),vp=page.getViewport({scale:w/base.width*dpr});
    const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;c.style.width=w+'px';c.style.height=vp.height/dpr+'px';
    body.appendChild(c);
    await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
  }
}
// «Открыть в другом приложении»: системное меню «Поделиться», а если его нет — обычное скачивание
async function saveFile(f,blob){
  const file=new File([blob],f.name,{type:f.type||'application/octet-stream'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}}catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=f.name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>alertMsg('Если файл не скачался, откройте планер в браузере: в Telegram скачивание из приложения может быть отключено.'),600);
}

// ---------- шторка тянется за ползунок и закрывается свайпом вниз ----------
(function(){
  const dz=$('shDrag');let y0=null,drag=false,dy=0,last=[];
  dz.addEventListener('pointerdown',e=>{y0=e.clientY;drag=false;dy=0;last=[{y:e.clientY,t:e.timeStamp}]});
  dz.addEventListener('pointermove',e=>{
    if(y0===null)return;
    dy=e.clientY-y0;
    if(!drag){if(Math.abs(dy)<5)return;drag=true;dz.setPointerCapture(e.pointerId);sheetEl.style.transition='none';backdropEl.style.transition='none';titleIn.blur();descIn.blur()}
    const y=dy<0?dy*.15:dy;                       // вверх — лёгкое сопротивление
    sheetEl.style.transform=`translateY(${y}px)`;
    backdropEl.style.opacity=String(Math.max(0,1-Math.max(0,y)/sheetEl.offsetHeight));
    last.push({y:e.clientY,t:e.timeStamp});if(last.length>5)last.shift();
  });
  const end=()=>{
    if(y0===null)return;
    const was=drag;y0=null;drag=false;
    if(!was)return;
    swiped=true;setTimeout(()=>swiped=false,80);
    const a=last[0],b=last[last.length-1],v=(b.y-a.y)/Math.max(1,b.t-a.t);
    sheetEl.style.transition='';backdropEl.style.transition='';
    if(dy>sheetEl.offsetHeight*.3||v>.5){haptic.tap();closeSheet()}      // closeSheet убирает inline-стили → шторка доезжает вниз
    else{sheetEl.style.transform='';backdropEl.style.opacity=''}          // иначе возвращается на место
  };
  dz.addEventListener('pointerup',end);dz.addEventListener('pointercancel',end);
})();

// ---------- события ----------
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a;
  switch(a){
    case 'day':if(swiped)return;S.selected=S.cursor=el.dataset.k;S.expanded=false;haptic.tap();render();break;
    case 'toggleCal':setExpanded(!S.expanded);break;
    case 'prev':step(-1);break;
    case 'next':step(1);break;
    case 'today':S.selected=S.cursor=S.today;haptic.tap();render();break;
    case 'cat':S.cat=el.dataset.id;haptic.tap();render();break;
    case 'toggle':{e.stopPropagation();const key=`${el.dataset.id}|${S.selected}`;
      const on=!S.done[key];
      if(on){S.done[key]=true;haptic.hit()}else{delete S.done[key];haptic.tap()}
      persist();render();break}
    case 'open':openSheet(S.tasks.find(t=>String(t.id)===el.dataset.id));break;
    case 'opennote':openSheet(S.notes.find(n=>String(n.id)===el.dataset.id),'note');break;
    case 'tab':setTab(el.dataset.t);break;
    case 'new':openSheet(null,S.tab==='notes'?'note':'task');break;
    case 'close':closeSheet();break;
    case 'preset':S.form.time=el.dataset.v;haptic.tap();renderSheet();syncWheels(S.form.time,true);break;
    case 'fcat':S.form.cat=el.dataset.id;haptic.tap();renderSheet();break;
    case 'mode':S.form.mode=el.dataset.id;haptic.tap();renderSheet();break;
    case 'dec':S.form.n=Math.max(2,S.form.n-1);haptic.tap();renderSheet();break;
    case 'inc':S.form.n=Math.min(60,S.form.n+1);haptic.tap();renderSheet();break;
    case 'attach':$('fileIn').click();break;
    case 'rmfile':e.stopPropagation();S.form.files=S.form.files.filter(f=>f.id!==el.dataset.id);haptic.tap();renderFiles();break;
    case 'openfile':openFile(S.form.files.find(f=>f.id===el.dataset.id));break;
    case 'vclose':closeViewer();break;
    case 'clip':{e.stopPropagation();
      const it=(el.dataset.k==='note'?S.notes:S.tasks).find(x=>String(x.id)===el.dataset.id);
      if(!it||!it.files||!it.files.length)break;
      if(it.files.length===1)openFile(it.files[0]);      // один файл — открываем сразу
      else{openSheet(it,el.dataset.k);setTimeout(()=>$('files').scrollIntoView({block:'center',behavior:'smooth'}),400)}
      break}
    case 'vshare':if(viewing)saveFile(viewing.f,viewing.blob);break;
    case 'save':saveTask();break;
    case 'del':removeTask();break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')backAction()});

// смена дня, если приложение открыто через полночь
setInterval(()=>{const t=toKey(new Date());if(t!==S.today){if(S.selected===S.today)S.selected=S.cursor=t;S.today=t;render()}},60000);

render();
load();
// подтягиваем свежие данные, когда приложение снова на экране
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!S.sheet)load()});
</script>
</body>
